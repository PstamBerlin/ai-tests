<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2a4a"/>
      <stop offset="1" stop-color="#3a4a7a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#e8e4d0">
    <circle cx="40" cy="30" r="1.4"/><circle cx="90" cy="18" r="1.1"/><circle cx="140" cy="42" r="1.2"/>
    <circle cx="200" cy="24" r="1.5"/><circle cx="255" cy="38" r="1.1"/><circle cx="310" cy="22" r="1.3"/>
    <circle cx="370" cy="46" r="1.2"/><circle cx="120" cy="60" r="0.9"/><circle cx="330" cy="70" r="0.9"/>
  </g>
  <!-- moon -->
  <circle cx="70" cy="70" r="28" fill="#f2e8c9" opacity="0.95"/>
  <circle cx="60" cy="62" r="5" fill="#d8c9a0" opacity="0.5"/>
  <circle cx="82" cy="80" r="3.4" fill="#d8c9a0" opacity="0.4"/>
  <circle cx="74" cy="88" r="2.2" fill="#d8c9a0" opacity="0.4"/>

  <!-- city skyline silhouette -->
  <path d="M0 300 L0 240 L24 240 L24 210 L40 210 L40 250 L58 250 L58 190 L76 190 L76 250 L96 250 L96 220 L116 220 L116 250 L138 250 L138 200 L160 200 L160 250 L182 250 L182 230 L206 230 L206 250 L228 250 L228 214 L252 214 L252 250 L276 250 L276 236 L300 236 L300 250 L326 250 L326 222 L350 222 L350 250 L374 250 L374 240 L400 240 L400 300 Z" fill="#141c30"/>
  <!-- lit windows -->
  <g fill="#f4d47a" opacity="0.85">
    <rect x="30" y="216" width="4" height="4"/><rect x="44" y="228" width="4" height="4"/>
    <rect x="62" y="198" width="4" height="4"/><rect x="62" y="210" width="4" height="4"/>
    <rect x="100" y="228" width="4" height="4"/><rect x="142" y="206" width="4" height="4"/>
    <rect x="186" y="236" width="4" height="4"/><rect x="230" y="220" width="4" height="4"/>
    <rect x="282" y="242" width="4" height="4"/><rect x="330" y="228" width="4" height="4"/>
  </g>

  <!-- ====== BIKE (night cruiser) ====== -->
  <!-- rear wheel -->
  <circle cx="150" cy="216" r="42" fill="none" stroke="#d8d2c0" stroke-width="5"/>
  <g stroke="#8a8474" stroke-width="1.2">
    <line x1="150" y1="180" x2="150" y2="252"/><line x1="114" y1="216" x2="186" y2="216"/>
    <line x1="125" y1="191" x2="175" y2="241"/><line x1="175" y1="191" x2="125" y2="241"/>
  </g>
  <circle cx="150" cy="216" r="6" fill="#666"/>
  <!-- front wheel -->
  <circle cx="295" cy="216" r="42" fill="none" stroke="#d8d2c0" stroke-width="5"/>
  <g stroke="#8a8474" stroke-width="1.2">
    <line x1="295" y1="180" x2="295" y2="252"/><line x1="259" y1="216" x2="331" y2="216"/>
    <line x1="270" y1="191" x2="320" y2="241"/><line x1="320" y1="191" x2="270" y2="241"/>
  </g>
  <circle cx="295" cy="216" r="6" fill="#666"/>
  <!-- frame -->
  <g stroke="#7ec8a8" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="150" y1="216" x2="215" y2="158"/>
    <line x1="215" y1="158" x2="275" y2="166"/>
    <line x1="150" y1="216" x2="200" y2="210"/>
    <line x1="230" y1="173" x2="215" y2="158"/>
    <line x1="275" y1="166" x2="295" y2="216"/>
    <line x1="230" y1="173" x2="275" y2="166"/>
    <line x1="215" y1="158" x2="212" y2="118"/>
  </g>
  <line x1="212" y1="118" x2="262" y2="114" stroke="#d8d2c0" stroke-width="6" stroke-linecap="round"/>
  <line x1="262" y1="114" x2="272" y2="128" stroke="#d8d2c0" stroke-width="5" stroke-linecap="round"/>
  <!-- seat + pedals -->
  <path d="M200 152 Q 212 146 224 152 Q 212 156 200 152 Z" fill="#2a2a2a"/>
  <circle cx="200" cy="210" r="9" fill="#3a3a3a"/>
  <line x1="200" y1="210" x2="212" y2="194" stroke="#3a3a3a" stroke-width="4"/>
  <line x1="200" y1="210" x2="188" y2="226" stroke="#3a3a3a" stroke-width="4"/>
  <!-- bike headlamp glow -->
  <ellipse cx="277" cy="130" rx="10" ry="12" fill="#f4d47a" opacity="0.9"/>
  <path d="M277 130 L 360 60 L 400 110 Z" fill="#f4d47a" opacity="0.12"/>

  <!-- ====== PELICAN, night edition ====== -->
  <!-- legs to pedals -->
  <line x1="222" y1="150" x2="212" y2="194" stroke="#e8932a" stroke-width="4" stroke-linecap="round"/>
  <line x1="218" y1="150" x2="188" y2="226" stroke="#e8932a" stroke-width="4" stroke-linecap="round"/>
  <!-- body leaning forward -->
  <ellipse cx="225" cy="118" rx="42" ry="30" fill="#f2ede0" stroke="#b8a880" stroke-width="1.5" transform="rotate(-12 225 118)"/>
  <path d="M186 106 Q 170 98 160 82 Q 176 90 184 94 Q 172 78 166 64 Q 180 78 188 86 Q 180 70 178 56 Q 190 72 196 84 Z" fill="#e0d8c4" stroke="#b8a880" stroke-width="1"/>
  <!-- wing detail -->
  <path d="M210 106 Q 232 98 252 110 Q 234 114 214 114 Z" fill="#d8cdb2" opacity="0.9"/>
  <!-- neck S-curve -->
  <path d="M240 100 Q 258 86 266 64 Q 272 48 266 38" fill="none" stroke="#f2ede0" stroke-width="13" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="266" cy="36" r="14" fill="#f2ede0"/>
  <!-- tiny night cap (new twist) -->
  <path d="M255 28 Q 266 16 278 27 Q 266 23 255 28 Z" fill="#c0392b"/>
  <circle cx="278" cy="26" r="3.4" fill="#f4d47a"/>
  <!-- eye (awake in the night) -->
  <circle cx="269" cy="31" r="2.6" fill="#1a1a1a"/>
  <circle cx="270" cy="30" r="0.9" fill="#fff"/>
  <!-- beak with pouch, moonlight-lit -->
  <path d="M274 32 Q 310 36 346 50 Q 348 60 338 62 Q 300 50 276 46 Q 272 40 274 32 Z" fill="#f4a83a" stroke="#d98f1f" stroke-width="1.2"/>
  <path d="M276 46 Q 300 52 330 58 Q 320 74 296 68 Q 280 60 276 46 Z" fill="#ffd98a" stroke="#e8b54a" stroke-width="1"/>
  <path d="M346 50 Q 352 53 348 58" fill="none" stroke="#d98f1f" stroke-width="2" stroke-linecap="round"/>
  <!-- wingtip to handlebar -->
  <path d="M252 110 Q 262 120 264 130 Q 258 132 252 126 Q 248 118 252 110 Z" fill="#f2ede0" stroke="#b8a880" stroke-width="1.2"/>
  <!-- night motion lines -->
  <g stroke="#8a8474" stroke-width="2" stroke-linecap="round">
    <line x1="128" y1="198" x2="108" y2="198"/>
    <line x1="134" y1="208" x2="118" y2="208"/>
    <line x1="132" y1="188" x2="116" y2="188"/>
  </g>

  <!-- fish in pouch (sleeping now, moonlit) -->
  <path d="M296 60 Q 312 56 324 60 Q 312 68 298 66 Q 292 64 296 60 Z" fill="#6fa0c8" stroke="#4a7ea6" stroke-width="1" opacity="0.95"/>
  <circle cx="305" cy="61" r="1.5" fill="#1a1a1a"/>
  <path d="M322 60 L 330 56 L 330 64 Z" fill="#4a7ea6"/>
  <!-- zzz from the fish -->
  <g font-size="9" fill="#d8d2c0" opacity="0.85">
    <text x="316" y="46">z</text>
    <text x="324" y="38">z</text>
    <text x="330" y="30">z</text>
  </g>

  <text x="18" y="34" font-size="15" font-style="italic" fill="#e8e4d0">Night ride — a pelican on a bike.</text>
  <text x="18" y="52" font-size="10" fill="#a8a090">The fish fell asleep in the pouch. GLM 5.3 (non-Flash), 11 Nov 2026.</text>
</svg>
